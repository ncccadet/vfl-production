# Auto-deploy to staging EC2 on push to 'staging' branch.
# Nothing goes to production without passing staging first.

name: Deploy to Staging

on:
  push:
    branches: [staging]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: voxera_law
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test Backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/voxera_law
          JWT_ACCESS_SECRET: test_secret
          JWT_REFRESH_SECRET: test_secret
        run: |
          cd backend
          npm ci
          npm test
      - name: Test Frontend
        run: |
          cd frontend
          npm ci
          npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Staging EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/voxera-law
            git pull origin staging || { echo "DEPLOY ABORTED: git pull failed. Server has uncommitted local changes that must be resolved manually before the next deploy."; exit 1; }
            cd backend  && npm ci --production
            cd ../frontend && npm ci && npm run build
            aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_FRONTEND_STAGING }}/ --delete
            aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
            cd ..
            pm2 startOrReload ecosystem.config.js --env production
            echo "Staging deploy complete $(date)"
